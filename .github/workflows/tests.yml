name: Prototype failure-path tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install 'fastapi>=0.116,<1' 'httpx>=0.28,<1' 'pytest>=8,<9'
      - run: python -m pytest -q tests
